amendments:   # threshold changes require an entry here — never a silent edit
- date: 2026-07-24
  rule: R1
  change: >
    Card narration contract amended from 'every high-confidence card detection' to
    'every CORROBORATED card: >=2 high-conf sightings within 10s' — applied in both
    the runtime priority block and the R1 fixture.
  before_evidence: >
    v7 trio run2 contained a lone single-burst yellow_card detection at 281.6s, 92s
    after the real card, with no replay markers — a false detection. The old contract
    demanded a line for it (fixture FAIL) and in an unlucky run the pipeline could
    have SPOKEN a false card.
  after_evidence: >
    Across all observed runs every real card produced 2-5 high-conf sightings; every
    false blip produced exactly 1. A minimum-SPAN requirement was considered and
    REJECTED with evidence: one real card (trio-2 run1) had exactly 2 sightings 0.5s
    apart (adjacent bursts) — any span floor would have missed a real card. Residual
    risk accepted and documented: a false detection that fires in 2 adjacent bursts
    would still qualify; no such case observed in any run to date.
  commit: (this commit)
- date: 2026-07-24
  rule: hallucination gate + R1 window
  change: >
    (1) Hallucination judge scope narrowed to EVENT-claiming lines; possession-dynamics
    lines are excluded from the single-frame judge and covered by deterministic fixtures.
    (2) R1 card window measured from CORROBORATION time (2nd sighting) — when the event
    becomes speakable — not the 1st sighting.
  before_evidence: >
    The judge's numeric verdicts were never parsed until codex-4 #1 (historic
    'hallucinations: 0' was a parser bug). Under correct parsing, 9/11 run-1 flags were
    grounded possession lines a single frame cannot validate (incl. the correctly
    guard-corrected card line); human review of v5 (159 comments, 71% positive) found no
    invented events. Trio r3 'missed' card was narrated 8.6s after the 1st sighting but
    3.1s after corroboration.
  after_evidence: fixtures + judged-set re-run on archived trio runs; genuine find kept:
    run-1 293.2s line named Kohn while the detector provided Juranovic (candidate R14,
    name-grounding).
  commit: (this commit)
- date: 2026-07-24
  rule: R1/R10 fixtures
  change: >
    R1 satisfied only by event language in the SPOKEN text (word-boundary patterns;
    hidden vision metadata no longer counts). R10 'goal call' narrowed to scoring
    language ('scores', 'goal for', 'finds the net'...) — 'in goal'/'guards the goal'
    goalkeeper phrasing no longer triggers it.
  before_evidence: >
    'the reds keep possession' satisfied red_card via substring 'red'; 'Zentner has it
    now for the hosts in goal' was treated as a goal call (trio-2 run1 false REJECT).
  after_evidence: fixtures re-run green on v6 artifacts and all archived v7 trio runs.
  commit: (this commit)

