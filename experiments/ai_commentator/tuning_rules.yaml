# Human-in-the-loop tuning rules ledger
# ======================================
# Each rule is distilled from reviewer feedback into a GENERIC statement (never a
# clip-specific patch), implemented as a prompt clause or code gate, and only
# ACCEPTED after the regression gate passes (see docs/ai/L2/hitl_tuning_workflow.md).
#
# status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20 -> accepted | rejected (with reason)
# guarded metrics that may never regress: hallucinations=0, survival>=0.95,
# desync_shifts=0, first_line<=2s; watched: words +/-15%, judge realism/variety.

- id: R1
  source: "sheet 2026-07-20 @0:06 'Why no mention of the yellow card?'"
  category: event-priority
  rule: >
    A HIGH-confidence card, goal, penalty or red-card event must always be
    narrated: it preempts pacing gates (like STT does) and may interrupt the
    trailing pause of a colour line. Never let a discipline/scoring event pass
    silently while low-value colour is spoken.
  implementation: code-gate (priority preempt for event class in {card, goal, penalty})
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R2
  source: "sheet @0:13 'Safe comment is pointless', @1:10 'Safe sentence means nothing'"
  category: content-floor
  rule: >
    Every line must carry at least one concrete, new piece of information
    (named player, event, location change, or shape change). Pure filler
    ("Midfield battle continues here", "Quiet spell, still all square") is
    only permitted after >=20s of silence and at most once per 60s.
  implementation: prompt clause (both stages) + lull-line rate limiter
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R3
  source: "sheet @0:56 'Repetition, not needed', @2:31 'Repeat sentence', @2:24 'Kind of duplicate'"
  category: fact-dedup
  rule: >
    The same fact instance (event type + team) may be narrated at most once
    per 25s unless NEW information is added (a player name, an outcome, a
    location change). Rephrasing the same fact does not qualify as new.
  implementation: code-gate (fact-instance dedup window, currently 8s -> 25s w/ new-info escape)
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R4
  source: "sheet @1:24 'previous sentence says exact opposite'"
  category: continuity
  rule: >
    A line that reverses the previous line's claim (possession flips, momentum
    reverses) must mark the transition explicitly ("Union win it back...") or
    not be spoken. Never assert the opposite state as if the previous line
    did not exist.
  implementation: prompt clause + post-check (possession flip without transition verb -> regenerate once, else skip)
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R5
  source: "sheet @1:52 '\"it\" refers to what?'"
  category: referential-clarity
  rule: >
    No pronoun without an explicit antecedent in the same line or the
    immediately preceding line. When in doubt use the concrete noun
    (the ball, the free kick, the cross).
  implementation: prompt clause (both stages + FR localizer)
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R6
  source: "sheet @1:59 'says long kick, actually short pass', @2:27 'not accurate'"
  category: precision-restraint
  rule: >
    Never state the MANNER of an action (long/short, driven/floated, powerful)
    unless the detector explicitly provides it. When evidence is coarse, use
    manner-neutral verbs ("plays it forward", not "launches it long").
  implementation: prompt clause (grounding section, both stages)
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R7
  source: "sheet @1:02, @2:06, @2:23, @2:38, @2:48, @3:16 (French cluster)"
  category: localization
  rule: >
    French output is football-French LOCALIZATION, not translation: written as
    a French TV commentator would say it. Maintain a glossary of banned
    calques and preferred terms (dernier tiers -> les trente derniers metres;
    sonder -> tenter/essayer; moment calme -> temps faible; aforementioned !=
    celebre; 'sont revenus' for players back in position, ...). Glossary is
    appended by reviewers and versioned with this file.
  implementation: rewrite TRANSLATE_SYSTEM as localizer persona + glossary block
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R8
  source: "sheet @3:20 'substitution, not change of foot - all 4 languages inaccurate'"
  category: stt-sanity
  rule: >
    A verbatim STT phrase is cross-checked against concurrent HIGH-confidence
    vision events: if the phrase is semantically odd AND a conflicting event
    is detected (e.g. STT nonsense during a detected substitution), prefer the
    event line and drop the phrase. Verbatim does not mean unvetted - ASR
    errors must not propagate into two languages.
  implementation: code-gate (STT/vision conflict check) + FR localizer sanity clause
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R9
  source: "sheet @0:13, @1:06, @1:19, @3:18 (eager preferred 4x, safe never)"
  category: product-default
  rule: >
    The eager (windowed-commentator + hedge) stage is the default voice; safe
    remains the fallback stage inside the hedge and a debugging baseline.
  implementation: config default BLEND_MODE=eager
  status: accepted   # direct human A/B verdict; hedge already guarantees the safe coverage floor

# ---------------------------------------------------------------------------
# PROCESS POLICY (adopted 2026-07-20 from cards-process review)
# ---------------------------------------------------------------------------
# 1. PIN THE DEFECT: a candidate rule must cite a pinned fixture (timestamp +
#    machine-checkable condition) reproducing the issue in the baseline BEFORE
#    implementation. (Validated the hard way: the first R1 gate ACCEPTed while
#    the yellow card was still unnarrated — the gate never encoded the defect.)
# 2. PER-RULE FIXTURES: on acceptance each rule keeps a named regression check
#    in eval_snapshot.run_fixtures. The suite only ever grows.
# 3. STOCHASTICITY: acceptance decisions gate on worst-of-N (N>=3) live runs;
#    fixtures must pass in ALL runs; record the spread here.
# 4. HOLDOUT: the reviewed match is a DEVELOPMENT set. The next reviewed match
#    is reserved as holdout; the accepted-rule suite re-runs on it before any
#    customer milestone. (Pending: needs Alex's next review on a new match.)
# 5. NO SILENT RELAXATION: guarded thresholds (survival>=0.95, first_line<=2s,
#    hallucinations<=baseline, desync=0) change ONLY via an amendment entry
#    below: before-evidence, change, after-evidence, commit hash.

fixtures:
  R1: "every high-conf card/goal/penalty in vis_detections has a line within 8s (auto)"
  R2: "no filler line within 15s of the previous line (auto)"
  R3: "same event-fact twice within 25s requires a name in the second (auto)"
  R4: "adjacent possession flips carry a transition marker (auto-heuristic)"
  R5: "reviewer-checked (no deterministic oracle)"
  R6: "reviewer-checked (no deterministic oracle)"
  R7: "banned French calques never appear in fr fields (auto); +cycle-3 forms: no 'ça se casse/se termine là', no 'le ballon de X' for a pass"
  R8: "reviewer-checked; veto events logged in run output"
  R12: "no line attributes a team-specific event to a named player whose roster team differs (auto: name->roster-team vs stated team)"
  R13: "no output line (any language) contains 'in the frame/in frame/in shot/in the picture/dans le cadre' (auto)"

- id: R14
  source: "judge audit 2026-07-24 (post codex-4 parser fix): 'Klaus makes the save' with
    vision=None; 'shapes the next free kick' on possession-only; 'takes the free kick'
    elaboration on a foul-only fact — generated lines inventing event language"
  category: event-grounding
  rule: >
    A generated (non-verbatim) line may use event language — save, free kick, corner,
    penalty, goal, substitution, card, throw-in, shot, foul — ONLY when the grounding
    context (vision fact / tracker) provides that event. Verbatim STT lines are exempt
    (broadcaster truth). Enforced as a deterministic emit-time veto, logged '[ veto ] R14'.
  implementation: code-gate unsupported_event_language() at emit
  status: accepted   # cycle-4, worst-of-3 triple-ACCEPT 2026-07-24 (v7)

- date: 2026-07-24
  rule: hallucination gate -> deterministic (R14 fixture); judge demoted to watched
  change: >
    The guarded hallucination metric is now fixture R14 (auto, fail-closed): every
    non-verbatim blend line using event language must carry the matching event fact in
    its own grounding context. The single-frame LLM judge count moves to WATCHED
    (tripwire, reported every gate, never accepts/rejects alone).
  before_evidence: >
    Post-parser-fix trio: judge flagged 7 lines; 6 were provably grounded in their own
    artifacts (goal_kick/free_kick/substitution/card facts present), incl. the correctly
    guard-corrected card line; the 1 genuine miss ('goal kick' phrasing on a
    possession-only fact) is exactly what R14 catches deterministically. The judge also
    cannot see multi-second dynamics from one frame and its style scores saturate (2/5).
  after_evidence: >
    R14 runtime veto caught 2 live inventions in the same trio ('Amiri takes the Mainz
    free kick' and 'Becker's cross and shot' — both unsupported); fixture green on runs
    with the veto active, red on the archived pre-veto run containing the goal-kick slip.
  commit: (this commit)
- id: R15
  source: "reviewer territory cluster (5 items: 'their own third' vs the opponent's) —
    tracker third is objective ground truth the pipeline was not enforcing"
  category: territory-grounding
  rule: >
    A spatial claim (own third/half vs final/attacking third) must agree with the
    tracker third for the subject team, resolved in the generic home/away pitch frame.
    Contradictions are CORRECTED at emit (own<->final swap), never spoken wrong.
    Verbatim STT exempt. Enforced + auto fixture (trk_third recorded per line).
  implementation: territory_zone()/fix_territory() at emit + fixture R15 (auto)
  status: accepted   # cycle-5, worst-of-3 triple-ACCEPT 2026-07-25 (R15 corrected 8 live territory claims across the 9 runs)

- id: R16
  source: "reviewer team-only event errors ('Foul for Union' -> Mainz); card A/B showed
    all frontier vision models make confident wrong team attributions"
  category: event-corroboration
  rule: >
    An EVENT team claim requires corroboration: tracker possession agreement OR an
    unambiguous broadcaster-named team (STT) near the moment. Uncorroborated claims
    keep the event and DROP the team attribution — generic-but-correct over
    specific-but-wrong. Applies at all profiles (extends the 6s-only tracker rule).
  implementation: decision-path gate (event_team dropped unless corroborated)
  status: accepted   # cycle-5, worst-of-3 triple-ACCEPT 2026-07-25

