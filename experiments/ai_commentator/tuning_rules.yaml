- id: R10
  source: "process discovery 2026-07-20: trio-1 run c2 spoke 'Mainz have scored!' on a
    2-burst false detection (adjacent bursts share 3/4 frames — not independent)"
  category: event-corroboration
  rule: >
    A GOAL call requires at least 3 high-confidence goal detections spanning at
    least 5 seconds (net + celebration + aftermath). Adjacent-burst blips are
    never a goal. Cards/penalties remain immediate (lower blast radius).
  implementation: code-gate in the R1 preempt + fixture R10 (auto)
  status: accepted   # cycle-1, trio-9 worst-of-3 2026-07-20

- id: R11
  source: "reviewer follow-up 2026-07-21: use pre-match naming forms AND kit colour
    (e.g. 'the reds') for team-reference variety"
  category: reference-variety
  rule: >
    Rotate team references among the APPROVED forms derived from pre-match data
    (names, abbreviation-expansions, hosts/visitors, kit-colour forms). Never
    the identical reference in consecutive lines about the same team; never an
    invented nickname. Forms are reviewer-extendable here.
  forms:
    Mainz: [Mainz, FSV Mainz, the hosts, the home side, the reds]
    Union: [Union, Union Berlin, the visitors, the away side, the men in green]
  implementation: prompt rule (both stages) + runtime last-form avoid-note +
    deterministic leading-form swap + fixture R11 (auto, earliest-position tagging)
  status: accepted   # trio-12 worst-of-3 2026-07-21

