# Include inside the sa-dev.agora.io TLS server.
location = /tennis_feedback {
    proxy_pass http://127.0.0.1:8092/tennis_feedback;
    proxy_read_timeout 15s;
}
location = /tennis_rounds {
    proxy_pass http://127.0.0.1:8092/tennis_rounds;
    proxy_read_timeout 15s;
}
location = /tennis_trigger {
    proxy_pass http://127.0.0.1:8092/tennis_trigger;
    proxy_read_timeout 15s;
}
