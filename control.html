<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Control Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
    }
    .match-card {
      background: #151515;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .match-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .match-id {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-idle     { background: #333; color: #888; }
    .badge-starting { background: #3b2e00; color: #fbbf24; }
    .badge-running  { background: #052e16; color: #4ade80; }
    .badge-stopped  { background: #1a1a2e; color: #818cf8; }
    .badge-error    { background: #2d0a0a; color: #f87171; }
    .stt-count {
      font-size: 13px;
      color: #888;
      margin-left: auto;
    }
    .lang-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .lang-table th {
      text-align: left;
      padding: 6px 12px;
      color: #666;
      font-weight: 600;
      border-bottom: 1px solid #222;
    }
    .lang-table td {
      padding: 6px 12px;
      border-bottom: 1px solid #1a1a1a;
    }
    .lang-table td:first-child {
      font-weight: 700;
      color: #fff;
    }
    .channel-name { color: #888; font-family: monospace; font-size: 12px; }
    .queue-size { color: #fbbf24; }
    .viewer-link {
      color: #60a5fa;
      text-decoration: none;
      font-size: 12px;
    }
    .viewer-link:hover { text-decoration: underline; }
    .error-msg {
      margin-top: 12px;
      padding: 8px 12px;
      background: #2d0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 4px;
      color: #f87171;
      font-size: 13px;
    }
    .telemetry {
      font-size: 11px;
      color: #666;
    }
    .telemetry .warn { color: #f87171; }
    .updated-at {
      font-size: 11px;
      color: #444;
      margin-top: 16px;
      text-align: right;
    }
    .btn-start, .btn-stop {
      padding: 5px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-start {
      background: #16a34a;
      color: #fff;
    }
    .btn-start:hover { background: #15803d; }
    .btn-start:disabled { background: #333; color: #666; cursor: default; }
    .btn-stop {
      background: #dc2626;
      color: #fff;
    }
    .btn-stop:hover { background: #b91c1c; }
    .btn-stop:disabled { background: #333; color: #666; cursor: default; }
  </style>
</head>
<body>
  <h1>Match Control Dashboard</h1>
  <div id="matches"></div>
  <div class="updated-at" id="updated-at"></div>

  <script>
    var CTL = window.location.origin;
    var container = document.getElementById('matches');
    var updatedEl = document.getElementById('updated-at');

    function badgeClass(state) {
      return 'badge badge-' + (state || 'idle');
    }

    function renderMatches(data) {
      var html = '';
      var ids = Object.keys(data);
      if (ids.length === 0) {
        html = '<p style="color:#666">No matches configured.</p>';
        container.innerHTML = html;
        return;
      }

      ids.forEach(function(mid) {
        var m = data[mid];
        html += '<div class="match-card">';
        html += '<div class="match-header">';
        html += '<span class="match-id">' + esc(m.match_id) + '</span>';
        html += '<span class="' + badgeClass(m.state) + '">' + esc(m.state) + '</span>';
        html += '<span class="stt-count">STT: ' + (m.stt_utterance_count || 0) + ' utterances</span>';

        var isRunnable = !m.state || m.state === 'idle' || m.state === 'stopped' || m.state === 'error';
        var isStoppable = m.state === 'starting' || m.state === 'running';
        if (isRunnable) {
          html += '<button class="btn-start" onclick="matchAction(\'' + esc(mid) + '\', \'start\')">Start</button>';
        } else if (isStoppable) {
          html += '<button class="btn-stop" onclick="matchAction(\'' + esc(mid) + '\', \'stop\')">Stop</button>';
        }

        html += '</div>';

        var langs = m.languages || {};
        var langKeys = Object.keys(langs);
        if (langKeys.length > 0) {
          html += '<table class="lang-table">';
          html += '<tr><th>Lang</th><th>Channel</th><th>State</th><th>TTS Queue</th><th>Telemetry</th><th>Viewer</th></tr>';
          langKeys.forEach(function(lang) {
            var l = langs[lang];
            var t = l.telemetry || {};
            var viewerUrl = CTL + '/viewer_live.html?match=' + encodeURIComponent(mid)
                            + '&lang=' + encodeURIComponent(lang);
            var sttWarn = (t.stt_cut_short_count || 0) > 0;
            html += '<tr>';
            html += '<td>' + lang.toUpperCase() + '</td>';
            html += '<td class="channel-name">' + esc(l.channel || '') + '</td>';
            html += '<td>' + esc(l.state || '') + '</td>';
            html += '<td class="queue-size">' + (l.tts_queue_size || 0) + '</td>';
            html += '<td class="telemetry">';
            html += 'stt:' + (t.stt_played || 0);
            html += ' sr:' + (t.sr_played || 0);
            html += ' sr_cut:' + (t.sr_cut_short_count || 0);
            html += ' <span class="' + (sttWarn ? 'warn' : '') + '">stt_cut:' + (t.stt_cut_short_count || 0) + '</span>';
            html += ' drop:' + (t.drop_count || 0);
            html += '</td>';
            html += '<td><a class="viewer-link" href="' + viewerUrl + '" target="_blank">Open</a></td>';
            html += '</tr>';
          });
          html += '</table>';
        }

        if (m.error) {
          html += '<div class="error-msg">' + esc(m.error) + '</div>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
      updatedEl.textContent = 'Updated: ' + new Date().toLocaleTimeString();
    }

    function esc(s) {
      if (!s) return '';
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function matchAction(matchId, action) {
      fetch(CTL + '/api/matches/' + encodeURIComponent(matchId) + '/' + action, {
        method: 'POST',
        mode: 'cors'
      })
        .then(function() { poll(); })
        .catch(function(err) { console.error('matchAction failed:', err); });
    }

    function poll() {
      fetch(CTL + '/api/matches', { mode: 'cors' })
        .then(function(r) { return r.json(); })
        .then(renderMatches)
        .catch(function(err) {
          container.innerHTML = '<p style="color:#f87171">Cannot reach server at ' + esc(CTL) + '</p>';
        });
    }

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
