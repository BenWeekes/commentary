<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Detail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .page-header {
      padding: 24px 24px 16px;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .header-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-idle     { background: #1a1a1a; color: #555; }
    .badge-starting { background: #2d2400; color: #fbbf24; }
    .badge-running  { background: #052e16; color: #4ade80; }
    .badge-stopped  { background: #1a1a2e; color: #818cf8; }
    .badge-error    { background: #2d0a0a; color: #f87171; }
    .header-meta {
      margin-left: auto;
      font-size: 12px;
      color: #555;
    }

    .summary-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 16px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #888;
    }
    .summary-bar .stat {
      display: flex;
      gap: 6px;
    }
    .summary-bar .stat-label { color: #555; }
    .summary-bar .stat-value { color: #ccc; font-weight: 600; }

    .tabs {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      gap: 2px;
      border-bottom: 1px solid #1e1e1e;
    }
    .tab {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .tab:hover { color: #aaa; }
    .tab.active {
      color: #fff;
      border-bottom-color: #2563eb;
    }

    .tab-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px 48px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Overview tab */
    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
      min-height: calc(100vh - 180px);
    }
    .overview-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .overview-card > :last-child {
      flex: 1;
    }
    .overview-card h3 {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .overview-card .lang-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }
    .overview-card .lang-name {
      font-weight: 600;
      color: #ccc;
    }
    .overview-card .lang-stats {
      color: #888;
    }

    /* Log table */
    .log-table-wrap {
      overflow-x: auto;
    }
    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .log-table th {
      text-align: left;
      padding: 8px 10px;
      background: #111;
      color: #555;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #1e1e1e;
      white-space: nowrap;
    }
    .col-info {
      display: inline-block;
      width: 13px; height: 13px;
      line-height: 13px;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      font-style: normal;
      color: #444;
      border: 1px solid #333;
      border-radius: 50%;
      margin-left: 4px;
      cursor: help;
      vertical-align: middle;
      text-transform: none;
      letter-spacing: 0;
    }
    .col-info:hover { color: #888; border-color: #666; }
    .log-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #111;
      color: #bbb;
      vertical-align: top;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-table tr:hover td { background: #0d0d0d; }
    .log-table .status-played { color: #4ade80; }
    .log-table .status-dropped { color: #f87171; }
    .log-table .status-replaced { color: #fbbf24; }
    .log-table .status-interrupted { color: #818cf8; }
    .log-table .status-suppressed { color: #f97316; }
    .log-table .source-sr { color: #60a5fa; font-weight: 600; }
    .log-table .source-stt { color: #a78bfa; font-weight: 600; }
    .log-table .text-cell {
      white-space: normal;
      word-break: break-word;
      max-width: 300px;
    }
    .log-table .num { font-family: monospace; color: #888; }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: #444;
      font-size: 14px;
    }

    .no-match {
      text-align: center;
      padding: 80px 24px;
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 id="match-title">Match Detail</h1>
    <span class="header-badge badge-idle" id="state-badge">idle</span>
    <span class="header-meta" id="updated-at"></span>
  </div>

  <div class="summary-bar" id="summary-bar"></div>

  <div class="tabs" id="tabs"></div>

  <div class="tab-content" id="tab-content"></div>

  <script>
    var LANG_NAMES = {
      es: 'Spanish', pt: 'Portuguese', fr: 'French', tr: 'Turkish',
      de: 'German', en: 'English', it: 'Italian', ar: 'Arabic',
      ja: 'Japanese', ko: 'Korean', zh: 'Chinese', hi: 'Hindi'
    };

    var params = new URLSearchParams(window.location.search);
    var CTL = window.location.origin;
    var MATCH = params.get('match') || '';
    var activeTab = 'overview';
    var matchData = null;
    var detailData = null;  // from /api/matches/{id}/detail
    var logCache = {};  // {tabKey: [rows]}

    if (!MATCH) {
      document.getElementById('tab-content').innerHTML =
        '<div class="no-match">No match specified. Open this page from the status dashboard.</div>';
    }

    function esc(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatMatchName(id) {
      var parts = id.split('_');
      if (parts.length >= 2) {
        var teams = parts.slice(0, -1).join(' vs ').toUpperCase();
        var suffix = parts[parts.length - 1];
        if (suffix === 'demo' || suffix === 'live') {
          return teams + ' (' + suffix.charAt(0).toUpperCase() + suffix.slice(1) + ')';
        }
        return (teams + ' ' + suffix).toUpperCase();
      }
      return id.replace(/_/g, ' ').toUpperCase();
    }

    function statusClass(status) {
      return 'status-' + (status || '').replace(/\s+/g, '-');
    }

    function sourceClass(source) {
      return 'source-' + (source || '');
    }

    function fmtNum(v) {
      if (v === null || v === undefined) return '-';
      return String(v);
    }

    function fmtMs(v) {
      if (v === null || v === undefined) return '-';
      return v + 'ms';
    }

    function fmtAudioStart(v) {
      if (v === null || v === undefined) return '-';
      var m = Math.floor(v / 60);
      var s = (v % 60).toFixed(2);
      return (m > 0 ? m + ':' : '') + (m > 0 ? s.padStart(5, '0') : s) + 's';
    }

    function th(label, tip) {
      return '<th>' + label + '<i class="col-info" title="' + esc(tip) + '">i</i></th>';
    }

    function fmtUtc(unixTs) {
      if (!unixTs) return '-';
      var d = new Date(unixTs * 1000);
      var h = String(d.getHours()).padStart(2, '0');
      var m = String(d.getMinutes()).padStart(2, '0');
      var s = String(d.getSeconds()).padStart(2, '0');
      var ms = String(d.getMilliseconds()).padStart(3, '0');
      return h + ':' + m + ':' + s + '.' + ms;
    }

    function truncate(s, len) {
      if (!s) return '';
      return s.length > len ? s.substring(0, len) + '...' : s;
    }

    // Build tabs from match data
    function buildTabs(data) {
      var langs = data.configured_languages || [];
      var tabsEl = document.getElementById('tabs');
      var contentEl = document.getElementById('tab-content');

      var tabDefs = [{ key: 'overview', label: 'Overview' }, { key: 'stt', label: 'STT' }];
      langs.forEach(function(lang) {
        tabDefs.push({ key: lang, label: lang.toUpperCase() });
      });

      var tabsHtml = '';
      var panelsHtml = '';
      tabDefs.forEach(function(t) {
        var cls = t.key === activeTab ? ' active' : '';
        tabsHtml += '<div class="tab' + cls + '" data-tab="' + t.key + '">' + esc(t.label) + '</div>';
        panelsHtml += '<div class="tab-panel' + cls + '" id="panel-' + t.key + '"></div>';
      });

      tabsEl.innerHTML = tabsHtml;
      contentEl.innerHTML = panelsHtml;

      // Tab click handlers
      tabsEl.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          activeTab = tab.getAttribute('data-tab');
          tabsEl.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
          contentEl.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
          tab.classList.add('active');
          document.getElementById('panel-' + activeTab).classList.add('active');
          renderActiveTab();
        });
      });
    }

    function updateHeader(data) {
      var displayName = (detailData && detailData.display_name) || formatMatchName(data.match_id);
      document.getElementById('match-title').textContent = displayName;
      document.title = displayName + ' - Detail';
      var badge = document.getElementById('state-badge');
      var state = data.state || 'idle';
      badge.textContent = state;
      badge.className = 'header-badge badge-' + state;

      var stats = [];
      stats.push('<span class="stat"><span class="stat-label">STT:</span><span class="stat-value">' + (data.stt_utterance_count || 0) + ' utterances</span></span>');
      var langs = data.languages || {};
      Object.keys(langs).forEach(function(lang) {
        var lt = langs[lang].telemetry || {};
        var played = (lt.stt_played || 0) + (lt.sr_played || 0);
        var dropped = lt.drop_count || 0;
        stats.push('<span class="stat"><span class="stat-label">' + lang.toUpperCase() + ':</span><span class="stat-value">' + played + ' played, ' + dropped + ' dropped</span></span>');
      });
      document.getElementById('summary-bar').innerHTML = stats.join('');
    }

    function renderOverview() {
      var panel = document.getElementById('panel-overview');
      if (!panel) return;
      var data = matchData;
      var detail = detailData || {};
      var meta = detail.match_meta || {};
      var langs = data.languages || {};
      var html = '<div class="overview-grid">';

      // Match info card
      html += '<div class="overview-card">';
      html += '<h3>Match Info</h3>';
      if (detail.display_name) {
        html += '<div class="lang-row"><span class="lang-name">Name</span><span class="lang-stats">' + esc(detail.display_name) + '</span></div>';
      }
      html += '<div class="lang-row"><span class="lang-name">Match ID</span><span class="lang-stats">' + esc(data.match_id) + '</span></div>';
      html += '<div class="lang-row"><span class="lang-name">Mode</span><span class="lang-stats">' + esc(detail.mode || '-') + '</span></div>';
      html += '<div class="lang-row"><span class="lang-name">State</span><span class="lang-stats">' + esc(data.state || 'idle') + '</span></div>';
      html += '<div class="lang-row"><span class="lang-name">STT Utterances</span><span class="lang-stats">' + (data.stt_utterance_count || 0) + '</span></div>';
      if (detail.translation_model) {
        html += '<div class="lang-row"><span class="lang-name">Translation Model</span><span class="lang-stats">' + esc(detail.translation_model) + '</span></div>';
      }
      if (detail.video_delay != null) {
        html += '<div class="lang-row"><span class="lang-name">Video Delay</span><span class="lang-stats">' + detail.video_delay + 's</span></div>';
      }
      if (detail.kickoff_utc || meta.kickoff_utc) {
        html += '<div class="lang-row"><span class="lang-name">Kickoff</span><span class="lang-stats">' + esc(detail.kickoff_utc || meta.kickoff_utc) + '</span></div>';
      }
      if (data.started_at) {
        var started = new Date(data.started_at * 1000);
        html += '<div class="lang-row"><span class="lang-name">Started</span><span class="lang-stats">' + started.toLocaleTimeString() + '</span></div>';
      }
      if (meta.last_refresh_iso) {
        html += '<div class="lang-row"><span class="lang-name">Last Refresh</span><span class="lang-stats">' + esc(meta.last_refresh_iso) + '</span></div>';
      }
      if (data.error) {
        html += '<div class="lang-row"><span class="lang-name" style="color:#f87171">Error</span><span class="lang-stats" style="color:#f87171">' + esc(data.error) + '</span></div>';
      }
      // Refresh button for live matches
      if (detail.mode === 'live') {
        html += '<div style="margin-top:10px"><button id="btn-refresh-detail" onclick="refreshMatchData()" style="padding:5px 14px;border:none;border-radius:6px;background:#7c3aed;color:#fff;font-size:12px;font-weight:600;cursor:pointer;">Refresh Data</button></div>';
      }
      html += '</div>';

      // Prepared data card: keyterms + roster
      html += '<div class="overview-card">';
      html += '<h3>Prepared Data</h3>';
      var kt = detail.keyterms || [];
      html += '<div class="lang-row"><span class="lang-name">Keyterms</span><span class="lang-stats">' + (detail.keyterms_count || 0) + ' terms (' + esc(detail.keyterms_source || '-') + ')</span></div>';
      if (meta.roster_player_count) {
        html += '<div class="lang-row"><span class="lang-name">Roster</span><span class="lang-stats">' + meta.roster_player_count + ' players</span></div>';
      }
      // Show roster text if available
      var roster = detail.roster;
      if (roster && roster.roster_text) {
        html += '<div style="margin-top:8px;font-size:11px;color:#666;line-height:1.5;overflow-y:auto;max-height:200px;white-space:pre-wrap;font-family:monospace;border:1px solid #1e1e1e;border-radius:4px;padding:8px;">';
        html += esc(roster.roster_text);
        html += '</div>';
      }
      // Show keyterms
      if (kt.length > 0) {
        html += '<div style="margin-top:8px;font-size:12px;color:#666;line-height:1.6;overflow-y:auto;flex:1;">';
        html += esc(kt.join(', '));
        html += '</div>';
      } else {
        html += '<div style="margin-top:8px;font-size:12px;color:#444;font-style:italic;">No keyterms file found</div>';
      }
      html += '</div>';

      // Current run card
      html += '<div class="overview-card">';
      html += '<h3>Current Run</h3>';
      if (detail.log_dir) {
        html += '<div class="lang-row"><span class="lang-name">Log Directory</span><span class="lang-stats" style="font-family:monospace;font-size:11px">' + esc(detail.log_dir) + '</span></div>';
        var files = detail.log_files || {};
        var fileKeys = Object.keys(files).sort();
        if (fileKeys.length > 0) {
          fileKeys.forEach(function(f) {
            html += '<div class="lang-row"><span class="lang-name" style="font-family:monospace">' + esc(f) + '</span><span class="lang-stats">' + files[f].lines + ' lines</span></div>';
          });
        }
      } else {
        html += '<div style="font-size:13px;color:#444;font-style:italic;">Not started yet</div>';
      }
      html += '</div>';

      // Per-language telemetry
      var langKeys = Object.keys(langs).filter(function(k) { return k !== 'original'; });
      if (langKeys.length > 0) {
        html += '<div class="overview-card">';
        html += '<h3>Language Pipelines</h3>';
        langKeys.forEach(function(lang) {
          var l = langs[lang];
          var t = l.telemetry || {};
          html += '<div class="lang-row">';
          html += '<span class="lang-name">' + lang.toUpperCase() + ' - ' + (LANG_NAMES[lang] || lang) + '</span>';
          html += '<span class="lang-stats">';
          html += (t.stt_played || 0) + ' stt, ';
          html += (t.sr_played || 0) + ' sr, ';
          html += (t.drop_count || 0) + ' drop';
          if (t.sr_cut_short_count) html += ', ' + t.sr_cut_short_count + ' sr-cut';
          if (t.stt_cut_short_count) html += ', ' + t.stt_cut_short_count + ' stt-cut';
          html += ' &mdash; q:' + (l.tts_queue_size || 0);
          html += '</span>';
          html += '</div>';
        });
        html += '</div>';
      }

      html += '</div>';
      panel.innerHTML = html;
    }

    function renderSttTab(rows) {
      var panel = document.getElementById('panel-stt');
      if (!panel) return;
      if (!rows || rows.length === 0) {
        panel.innerHTML = '<div class="empty-state">No STT log data yet</div>';
        return;
      }
      var vDelay = (detailData && detailData.video_delay) ? detailData.video_delay : 7;
      var html = '<div class="log-table-wrap"><table class="log-table">';
      html += '<thead><tr>';
      html += th('Original', 'UTC time played on Original channel (no delay)');
      html += th('Scheduled', 'UTC time scheduled to play on translated channels (delayed by ' + vDelay + 's)');
      html += th('Text', 'English text from Deepgram STT');
      html += th('Offset', 'Position in the audio source file');
      html += th('Recognized', 'UTC wall clock when Deepgram returned this utterance');
      html += '</tr></thead>';
      html += '<tbody>';
      rows.forEach(function(r) {
        // Original played = scheduled - video_delay (original has no delay)
        var origPlayed = r.play_at ? r.play_at - vDelay : null;
        html += '<tr>';
        html += '<td class="num">' + fmtUtc(origPlayed) + '</td>';
        html += '<td class="num">' + fmtUtc(r.play_at) + '</td>';
        html += '<td class="text-cell">' + esc(r.text) + '</td>';
        html += '<td class="num">' + fmtAudioStart(r.audio_start) + ' - ' + fmtAudioStart(r.audio_end) + '</td>';
        html += '<td class="num">' + (r.wall_clock || '-') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      panel.innerHTML = html;
    }

    function renderLangTab(lang, rows) {
      var panel = document.getElementById('panel-' + lang);
      if (!panel) return;
      if (!rows || rows.length === 0) {
        panel.innerHTML = '<div class="empty-state">No log data for ' + lang.toUpperCase() + ' yet</div>';
        return;
      }
      var html = '<div class="log-table-wrap"><table class="log-table">';
      html += '<thead><tr>';
      html += th('Played', 'UTC time audio actually started playing (or scheduled time if not played)');
      html += th('Original', 'English source text from STT or Sportradar');
      html += th('Translated', 'Translated text sent to TTS');
      html += th('Status', 'played = audio delivered, dropped = too late, replaced = superseded, interrupted = cut short');
      html += th('Src', 'stt = commentator utterance, sr = Sportradar gap-fill event');
      html += th('Lag', 'Milliseconds late vs scheduled play time (0 = on time)');
      html += th('Xlat', 'Translation API round-trip time in ms');
      html += th('TTS', 'ElevenLabs TTS fetch time in ms');
      html += th('Dur', 'Actual audio duration played in ms');
      html += '</tr></thead>';
      html += '<tbody>';
      rows.forEach(function(r) {
        // Show play_started_at if played, otherwise play_at (scheduled time)
        var playTime = r.play_started_at || r.play_at;
        html += '<tr>';
        html += '<td class="num">' + fmtUtc(playTime) + '</td>';
        html += '<td class="text-cell" title="' + esc(r.original) + '">' + esc(truncate(r.original, 80)) + '</td>';
        html += '<td class="text-cell" title="' + esc(r.translated) + '">' + esc(truncate(r.translated, 80)) + '</td>';
        html += '<td class="' + statusClass(r.status) + '">' + esc(r.status) + '</td>';
        html += '<td class="' + sourceClass(r.source) + '">' + esc(r.source) + '</td>';
        html += '<td class="num">' + fmtMs(r.start_lag_ms) + '</td>';
        html += '<td class="num">' + fmtMs(r.xlat_ms) + '</td>';
        html += '<td class="num">' + fmtMs(r.tts_ms) + '</td>';
        html += '<td class="num">' + fmtMs(r.play_duration_ms) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      panel.innerHTML = html;
    }

    function renderActiveTab() {
      if (activeTab === 'overview') {
        if (matchData) renderOverview();
        return;
      }
      var rows = logCache[activeTab];
      if (activeTab === 'stt') {
        renderSttTab(rows);
      } else {
        renderLangTab(activeTab, rows);
      }
    }

    function refreshMatchData() {
      var btn = document.getElementById('btn-refresh-detail');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = 'Refreshing...';
      fetch(CTL + '/api/matches/' + encodeURIComponent(MATCH) + '/refresh-data', {
        method: 'POST', mode: 'cors'
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          btn.disabled = false;
          if (data.status === 'ok') {
            btn.textContent = 'Done (' + (data.keyterm_count || 0) + ' terms, ' + (data.roster_player_count || 0) + ' players)';
            setTimeout(function() { btn.textContent = 'Refresh Data'; }, 4000);
            // Force re-poll to pick up new data
            poll();
          } else {
            btn.textContent = data.status || 'Error';
            setTimeout(function() { btn.textContent = 'Refresh Data'; }, 4000);
          }
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Refresh Data';
        });
    }

    function fetchLogs(key) {
      return fetch(CTL + '/api/matches/' + encodeURIComponent(MATCH) + '/logs/' + key + '?tail=200', { mode: 'cors' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data && data.rows) {
            logCache[key] = data.rows;
          }
        })
        .catch(function() {});
    }

    var tabsBuilt = false;

    function fetchDetail() {
      return fetch(CTL + '/api/matches/' + encodeURIComponent(MATCH) + '/detail', { mode: 'cors' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data) detailData = data;
        })
        .catch(function() {});
    }

    function poll() {
      if (!MATCH) return;

      // Fetch match status and detail in parallel
      var statusFetch = fetch(CTL + '/api/matches', { mode: 'cors' })
        .then(function(r) { return r.json(); });
      var detailFetch = fetchDetail();

      Promise.all([statusFetch, detailFetch])
        .then(function(results) {
          var data = results[0];
          var m = data[MATCH];
          if (!m) {
            document.getElementById('tab-content').innerHTML =
              '<div class="no-match">Match "' + esc(MATCH) + '" not found</div>';
            return;
          }
          matchData = m;
          updateHeader(m);

          if (!tabsBuilt) {
            buildTabs(m);
            tabsBuilt = true;
          }

          // Fetch ALL log tabs every poll so switching tabs is instant
          var langs = m.configured_languages || [];
          var fetches = [fetchLogs('stt')];
          langs.forEach(function(lang) {
            fetches.push(fetchLogs(lang));
          });

          return Promise.all(fetches);
        })
        .then(function() {
          renderActiveTab();
          document.getElementById('updated-at').textContent = 'Updated ' + new Date().toLocaleTimeString();
        })
        .catch(function() {});
    }

    if (MATCH) {
      poll();
      setInterval(poll, 3000);
    }
  </script>
</body>
</html>
