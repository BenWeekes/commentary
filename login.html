<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportPortal Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
    }
    .login-box h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .login-box p {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #444;
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #1d4ed8; }
    .btn-login:disabled { background: #1a1a1a; color: #444; cursor: default; }
    .error-msg {
      margin-top: 16px;
      padding: 8px 12px;
      background: #2d0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      color: #f87171;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>SportPortal</h1>
    <p>Operator login</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit" class="btn-login" id="btn-submit">Sign In</button>
    </form>
    <div class="error-msg" id="error-msg"></div>
  </div>
  <script>
    var form = document.getElementById('login-form');
    var errorEl = document.getElementById('error-msg');
    var btn = document.getElementById('btn-submit');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      fetch(window.location.origin + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Sign In';
          if (res.ok) {
            window.location.href = res.data.redirect || '/status.html';
          } else {
            errorEl.textContent = res.data.error || 'Login failed';
            errorEl.style.display = 'block';
          }
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Sign In';
          errorEl.textContent = 'Cannot reach server';
          errorEl.style.display = 'block';
        });
    });
  </script>
</body>
</html>
