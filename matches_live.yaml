# Live Bundesliga MD33 — May 8-10, 2026
# DO NOT commit — contains SRT stream keys
#
# SRT ingest server (Europe):
#   srt://srtlive-rtcpush-prod-eu.agoramdn.com:6001
#
# Internal ingest publishes combined program feed on UID 73.
# Initial SRT mode has no separate source atmosphere/commentary stems.

control_port: 8080
translation_model: "gpt-5.5"
translation_fallback_model: "gpt-5.4"
translation_context_enabled: true
stt_playback_offset_ms: 0
stt_playback_offsets_ms:
  soniox: 700
  deepgram: 830
  deepgram_nova3: 830

cloud_recording:
  vendor: 1
  region: 1
  bucket: "dev-generic"
  fileNamePrefix: ["TEST9"]

matches:
  # Demo — loops the BMG vs FCH clip through a local SRT listener and runs
  # the same live srt_direct pipeline used for real matches. Manual start.
  - match_id: bmg_fch_demo
    display_name: "BMG vs FCH (Demo via SRT)"
    mode: live
    enabled: true
    auto_manage: false
    sport_event_id: "sr:sport_event:61514104"
    source:
      type: demo_srt_direct
      demo_media_file: clips/bmg_fch_demo_5min/source.mp4
      demo_atmosphere_file: clips/bmg_fch_demo_5min/atmosphere.wav
      demo_srt_port: 10080
      demo_loop: false
      original_channel: bmg_fch_demo-original
      publish_uid: 73
      original_buffer_seconds: 1.0
      retry_seconds: 5
      audio_stream_index: 2
      atmosphere_audio_stream_index: 1
    video_uid: 73
    video_delay: 16.0
    max_stt_duration: 8.5
    # Switch between deepgram_nova3 and soniox for live-demo STT comparisons.
    stt_provider: soniox
    stt_endpoint_delay_ms: 1500
    languages: [es, pt, fr, tr, de]

  # Demo — loops the reviewed Mainz vs Union evaluation section through local
  # SRT so Deepgram Nova-3 and Soniox can be compared against the gold transcript.
  - match_id: m05_uni_eval_demo
    display_name: "Mainz vs Union (Gold Eval via SRT)"
    mode: live
    enabled: true
    auto_manage: false
    sport_event_id: "sr:sport_event:61514186"
    source:
      type: demo_srt_direct
      demo_media_file: clips/m05_uni_eval_25min/source.mp4
      demo_srt_port: 10081
      demo_loop: false
      original_channel: m05_uni_eval_demo-original
      publish_uid: 73
      original_buffer_seconds: 1.0
      retry_seconds: 5
      audio_stream_index: 1
      atmosphere_audio_stream_index: -1
    video_uid: 73
    video_delay: 16.0
    max_stt_duration: 8.5
    stt_provider: soniox
    stt_endpoint_delay_ms: 1500
    # Optional speaker-specific ElevenLabs voices. Fill these when voice IDs
    # are chosen; per-language maps can override the default map.
    speaker_voice_ids:
      default:
        s0: ""
        s1: ""
      en:
        s1: "HfRP3cIhYLmeNHeTvkWK"
      es:
        s1: "851ejYcv2BoNPjrkw93G"
      pt:
        s1: "bOJEJUvPf8t9H4jeMfOP"
      fr:
        s1: "V8kvppYJoYqSL61Tr8Dn"
      tr:
        s1: "OP4UedUzNB5e2mktGvdT"
      de:
        s1: "IxprfqLvLirqXn7FdoLy"
    languages: [en, es, pt, fr, tr, de]

  # Latency probe — looped clip with spoken time markers every 5s.
  # Use to measure end-to-end delay (source mark T vs listener wall-clock).
  - match_id: latency_test
    display_name: "Latency Test (5s Markers)"
    mode: live
    enabled: true
    auto_manage: false
    sport_event_id: ""
    source:
      type: demo_srt_direct
      demo_media_file: clips/latency_test/source.mp4
      demo_srt_port: 10082
      demo_loop: false
      original_channel: latency_test-original
      publish_uid: 73
      original_buffer_seconds: 1.0
      retry_seconds: 5
      audio_stream_index: 1
      atmosphere_audio_stream_index: -1
    video_uid: 73
    video_delay: 14.0
    max_stt_duration: 6.5
    stt_provider: soniox
    stt_endpoint_delay_ms: 1500
    languages: [en, es]

