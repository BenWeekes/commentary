<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportPortal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .top-banner {
      background: linear-gradient(90deg, #111 0%, #1a1a2e 50%, #111 100%);
      border-bottom: 1px solid #1e1e1e;
      padding: 8px 24px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .top-banner span { color: #999; }
    .header {
      padding: 28px 24px 12px;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .header-left h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .header-left p {
      margin-top: 4px;
      font-size: 13px;
      color: #888;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-right a {
      color: #999;
      font-size: 12px;
      text-decoration: none;
    }
    .header-right a:hover { color: #fff; }
    .matches {
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 24px 48px;
    }
    .match-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .match-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 22px 6px;
    }
    .match-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
      margin-right: 2px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50% { opacity: 0.7; box-shadow: 0 0 0 5px rgba(239,68,68,0); }
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-mode-demo   { background: #1a1a2e; color: #818cf8; }
    .badge-mode-live   { background: #1e1b4b; color: #a78bfa; }
    /* Scheduler state badges */
    .badge-demo        { background: #1a1a2e; color: #818cf8; }
    .badge-upcoming    { background: #1a1a1a; color: #666; }
    .badge-countdown   { background: #2d2400; color: #fbbf24; }
    .badge-armed       { background: #312e81; color: #a78bfa; }
    .badge-starting    { background: #2d2400; color: #fbbf24; }
    .badge-running     { background: #052e16; color: #4ade80; }
    .badge-finished    { background: #1a1a2e; color: #818cf8; }
    .badge-stopping    { background: #2d2400; color: #fbbf24; }
    .badge-stopped     { background: #1a1a2e; color: #818cf8; }
    .badge-error       { background: #2d0a0a; color: #f87171; }
    .badge-idle        { background: #1a1a1a; color: #555; }
    .badge-unknown     { background: #1a1a1a; color: #555; }
    .badge-disabled    { background: #1a1a1a; color: #444; }
    .badge-waiting_for_source { background: #2d2400; color: #fbbf24; }
    .match-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 22px 14px;
      font-size: 12px;
      color: #999;
    }
    .match-meta .countdown {
      color: #fbbf24;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .match-meta .countdown.negative { color: #777; }
    .match-meta .stt-count { color: #4ade80; }
    .match-meta .freshness { color: #888; }
    .match-meta .freshness.stale { color: #f87171; }
    .match-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 5px 16px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-start    { background: #16a34a; color: #fff; }
    .btn-start:hover { background: #15803d; }
    .btn-stop     { background: #dc2626; color: #fff; }
    .btn-stop:hover  { background: #b91c1c; }
    .btn-refresh  { background: #7c3aed; color: #fff; }
    .btn-refresh:hover { background: #6d28d9; }
    .btn-watch    { background: #2563eb; color: #fff; }
    .btn-watch:hover { background: #1d4ed8; }
    .btn-detail   { background: #2a2a2a; border: 1px solid #444; color: #bbb; }
    .btn-detail:hover { background: #3a3a3a; color: #fff; }
    .btn:disabled, .btn.disabled {
      background: #1a1a1a !important;
      color: #444 !important;
      cursor: default;
      pointer-events: none;
    }
    .error-msg {
      margin: 0 22px 14px;
      padding: 8px 12px;
      background: #2d0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      color: #f87171;
      font-size: 12px;
    }
    .no-matches {
      text-align: center;
      padding: 80px 24px;
      color: #444;
      font-size: 15px;
    }
    .server-error {
      text-align: center;
      padding: 80px 24px;
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="top-banner">Sportradar <span>|</span> Agora</div>
  <div class="header">
    <div class="header-left">
      <h1>SportPortal</h1>
      <p>Upcoming / live multilingual match operations</p>
    </div>
    <div class="header-right">
      <a href="#" onclick="doLogout();return false;">Logout</a>
    </div>
  </div>
  <div class="matches" id="matches"></div>

  <script>
    var CTL = window.location.origin;
    var container = document.getElementById('matches');
    var overviewData = null;  // latest from server
    var localCountdowns = {}; // per-match local ticking countdown
    var lastPollAt = 0;

    function esc(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatCountdown(seconds) {
      if (seconds === null || seconds === undefined) return '';
      var neg = seconds < 0;
      var abs = Math.abs(Math.floor(seconds));
      var d = Math.floor(abs / 86400);
      var h = Math.floor((abs % 86400) / 3600);
      var m = Math.floor((abs % 3600) / 60);
      var s = abs % 60;
      var parts = [];
      if (d > 0) parts.push(d + 'd');
      if (h > 0 || d > 0) parts.push(h + 'h');
      parts.push(m + 'm');
      parts.push(s + 's');
      return (neg ? '+' : '') + parts.join(' ');
    }

    function formatKickoff(utc) {
      if (!utc) return '';
      try {
        var dt = new Date(utc);
        return dt.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch(e) { return utc; }
    }

    function formatFreshness(ts) {
      if (!ts) return '';
      var ago = Math.floor((Date.now() / 1000) - ts);
      if (ago < 60) return 'refreshed just now';
      if (ago < 3600) return 'refreshed ' + Math.floor(ago / 60) + 'm ago';
      if (ago < 86400) return 'refreshed ' + Math.floor(ago / 3600) + 'h ago';
      return 'refreshed ' + Math.floor(ago / 86400) + 'd ago';
    }

    function renderOverview(data) {
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="no-matches">No matches configured</div>';
        return;
      }

      var html = '';
      data.forEach(function(m) {
        var mid = m.match_id;
        var workerRunning = m.worker_state === 'running';
        var workerActive = m.worker_state === 'starting' || m.worker_state === 'running';
        var schedState = m.scheduler_state || 'unknown';
        var isDemo = m.mode === 'demo';
        var enabled = m.enabled !== false;
        var cd = localCountdowns[mid];

        html += '<div class="match-card">';

        // Top row: name + badges + actions
        html += '<div class="match-top">';
        if (workerRunning) html += '<span class="live-dot"></span>';
        html += '<span class="match-name">' + esc(m.display_name || mid) + '</span>';
        html += '<span class="badge badge-mode-' + m.mode + '">' + esc(m.mode) + '</span>';
        if (!enabled) {
          html += '<span class="badge badge-disabled">disabled</span>';
        } else {
          html += '<span class="badge badge-' + schedState + '">' + esc(schedState.replace(/_/g, ' ')) + '</span>';
        }
        // Worker state if different from scheduler state
        if (m.worker_state && m.worker_state !== 'idle' && m.worker_state !== schedState) {
          html += '<span class="badge badge-' + m.worker_state + '">' + esc(m.worker_state) + '</span>';
        }

        html += '<span class="match-actions">';

        if (isDemo) {
          var isRunnable = !m.worker_state || m.worker_state === 'idle' || m.worker_state === 'stopped' || m.worker_state === 'error';
          if (isRunnable) {
            html += '<button class="btn btn-start" onclick="matchAction(\'' + esc(mid) + '\', \'start\')">Start</button>';
          } else if (workerActive) {
            html += '<button class="btn btn-stop" onclick="matchAction(\'' + esc(mid) + '\', \'stop\')">Stop</button>';
          }
        } else {
          if (workerActive) {
            html += '<button class="btn btn-refresh" disabled title="Refresh applies on next start">Refresh</button>';
          } else {
            html += '<button class="btn btn-refresh" onclick="refreshData(\'' + esc(mid) + '\', this)">Refresh</button>';
          }
        }

        var watchUrl = CTL + '/viewer_live.html?match=' + encodeURIComponent(mid);
        if (workerActive) {
          html += '<a class="btn btn-watch" href="' + watchUrl + '" target="_blank">Watch</a>';
        } else {
          html += '<a class="btn btn-watch disabled" aria-disabled="true">Watch</a>';
        }
        var detailUrl = CTL + '/match_detail.html?match=' + encodeURIComponent(mid);
        html += '<a class="btn btn-detail" href="' + detailUrl + '" target="_blank">Detail</a>';
        html += '</span>';
        html += '</div>';

        // Meta row: kickoff, countdown, STT, freshness
        html += '<div class="match-meta">';
        if (m.kickoff_utc) {
          html += '<span>' + esc(formatKickoff(m.kickoff_utc)) + '</span>';
        }
        if (cd !== undefined && cd !== null && !isDemo) {
          var cdClass = cd < 0 ? 'countdown negative' : 'countdown';
          html += '<span class="' + cdClass + '">' + esc(formatCountdown(cd)) + '</span>';
        }
        if (m.stt_utterance_count > 0) {
          html += '<span class="stt-count">' + m.stt_utterance_count + ' STT</span>';
        }
        if (m.configured_languages && m.configured_languages.length > 0) {
          html += '<span>' + esc(m.configured_languages.join(', ').toUpperCase()) + '</span>';
        }
        if (m.last_refresh_at) {
          var freshAge = (Date.now() / 1000) - m.last_refresh_at;
          var freshClass = freshAge > 1800 ? 'freshness stale' : 'freshness';
          html += '<span class="' + freshClass + '">' + esc(formatFreshness(m.last_refresh_at)) + '</span>';
        }
        html += '</div>';

        // Error — show worker error or scheduler last_error
        var errText = m.error || m.last_error;
        if (errText) {
          html += '<div class="error-msg">' + esc(errText) + '</div>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
    }

    function refreshData(matchId, btn) {
      btn.disabled = true;
      btn.textContent = 'Refreshing...';
      fetch(CTL + '/api/matches/' + encodeURIComponent(matchId) + '/refresh-data', {
        method: 'POST'
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          btn.disabled = false;
          btn.textContent = 'Refresh';
          if (data.status === 'ok') {
            btn.textContent = 'Done (' + (data.keyterm_count || 0) + ' terms)';
            setTimeout(function() { btn.textContent = 'Refresh'; }, 3000);
          } else {
            btn.textContent = data.error || data.status || 'Error';
            setTimeout(function() { btn.textContent = 'Refresh'; }, 3000);
          }
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Refresh';
        });
    }

    function matchAction(matchId, action) {
      fetch(CTL + '/api/matches/' + encodeURIComponent(matchId) + '/' + action, {
        method: 'POST'
      })
        .then(function() { poll(); })
        .catch(function(err) { console.error('matchAction failed:', err); });
    }

    function poll() {
      fetch(CTL + '/api/status/overview')
        .then(function(r) {
          if (r.status === 401) {
            window.location.href = '/login.html';
            return null;
          }
          return r.json();
        })
        .then(function(data) {
          if (!data) return;
          overviewData = data;
          lastPollAt = Date.now();
          // Seed local countdowns from server
          data.forEach(function(m) {
            if (m.countdown_seconds !== null && m.countdown_seconds !== undefined) {
              localCountdowns[m.match_id] = m.countdown_seconds;
            }
          });
          renderOverview(data);
        })
        .catch(function() {
          container.innerHTML = '<div class="server-error">Cannot reach server</div>';
        });
    }

    // Local 1-second countdown tick between polls
    function tickCountdowns() {
      if (!overviewData) return;
      var elapsed = (Date.now() - lastPollAt) / 1000;
      var changed = false;
      overviewData.forEach(function(m) {
        if (m.countdown_seconds !== null && m.countdown_seconds !== undefined) {
          var newVal = m.countdown_seconds - elapsed;
          if (Math.floor(newVal) !== Math.floor(localCountdowns[m.match_id] || 0)) {
            changed = true;
          }
          localCountdowns[m.match_id] = newVal;
        }
      });
      if (changed) renderOverview(overviewData);
    }

    function doLogout() {
      fetch(CTL + '/api/logout', { method: 'POST' })
        .then(function() { window.location.href = '/login.html'; })
        .catch(function() { window.location.href = '/login.html'; });
    }

    poll();
    setInterval(poll, 3000);
    setInterval(tickCountdowns, 1000);
  </script>
</body>
</html>
