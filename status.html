<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Matches</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      padding: 32px 24px 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .header p {
      margin-top: 6px;
      font-size: 14px;
      color: #666;
    }
    .matches {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }
    .match-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .match-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px 16px;
    }
    .match-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-idle     { background: #1a1a1a; color: #555; }
    .badge-starting { background: #2d2400; color: #fbbf24; }
    .badge-running  { background: #052e16; color: #4ade80; }
    .badge-stopped  { background: #1a1a2e; color: #818cf8; }
    .badge-error    { background: #2d0a0a; color: #f87171; }
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
      margin-right: 2px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50% { opacity: 0.7; box-shadow: 0 0 0 5px rgba(239,68,68,0); }
    }
    .stt-count {
      font-size: 12px;
      color: #555;
    }
    .match-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-start, .btn-stop {
      padding: 6px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }
    .btn-start {
      background: #16a34a;
      color: #fff;
    }
    .btn-start:hover { background: #15803d; }
    .btn-start:disabled { background: #1a1a1a; color: #444; cursor: default; }
    .btn-stop {
      background: #dc2626;
      color: #fff;
    }
    .btn-stop:hover { background: #b91c1c; }
    .btn-stop:disabled { background: #1a1a1a; color: #444; cursor: default; }
    .btn-action {
      padding: 6px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.15s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-watch {
      background: #2563eb;
      color: #fff;
    }
    .btn-watch:hover { background: #1d4ed8; }
    .btn-watch.disabled {
      background: #1a1a1a;
      color: #444;
      cursor: default;
      pointer-events: none;
    }
    .btn-detail {
      background: #333;
      color: #ccc;
    }
    .btn-detail:hover { background: #444; color: #fff; }

    .error-msg {
      margin: 0 24px 16px;
      padding: 8px 12px;
      background: #2d0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      color: #f87171;
      font-size: 13px;
    }
    .no-matches {
      text-align: center;
      padding: 80px 24px;
      color: #444;
      font-size: 15px;
    }
    .server-error {
      text-align: center;
      padding: 80px 24px;
      color: #f87171;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Live Matches</h1>
    <p id="subtitle">Multilingual commentary status</p>
  </div>
  <div class="matches" id="matches"></div>

  <script>
    var CTL = window.location.origin;
    var container = document.getElementById('matches');

    function esc(s) {
      if (!s) return '';
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatMatchName(id) {
      var parts = id.split('_');
      if (parts.length >= 2) {
        var teams = parts.slice(0, -1).join(' vs ').toUpperCase();
        var suffix = parts[parts.length - 1];
        if (suffix === 'demo' || suffix === 'live') {
          return teams + ' (' + suffix.charAt(0).toUpperCase() + suffix.slice(1) + ')';
        }
        return (teams + ' ' + suffix).toUpperCase();
      }
      return id.replace(/_/g, ' ').toUpperCase();
    }

    function renderMatches(data) {
      var ids = Object.keys(data);
      if (ids.length === 0) {
        container.innerHTML = '<div class="no-matches">No matches configured</div>';
        return;
      }

      var html = '';
      ids.forEach(function(mid) {
        var m = data[mid];
        var isLive = m.state === 'running';

        html += '<div class="match-card">';
        html += '<div class="match-top">';
        if (isLive) html += '<span class="live-dot"></span>';
        html += '<span class="match-name">' + esc(formatMatchName(m.match_id)) + '</span>';
        html += '<span class="badge badge-' + (m.state || 'idle') + '">' + esc(m.state || 'idle') + '</span>';
        html += '<span class="match-actions">';
        if (m.stt_utterance_count > 0) {
          html += '<span class="stt-count">' + m.stt_utterance_count + ' utterances</span>';
        }
        var isRunnable = !m.state || m.state === 'idle' || m.state === 'stopped' || m.state === 'error';
        var isStoppable = m.state === 'starting' || m.state === 'running';
        if (isRunnable) {
          html += '<button class="btn-start" onclick="matchAction(\'' + esc(mid) + '\', \'start\')">Start</button>';
        } else if (isStoppable) {
          html += '<button class="btn-stop" onclick="matchAction(\'' + esc(mid) + '\', \'stop\')">Stop</button>';
        }
        var watchUrl = CTL + '/viewer_live.html?match=' + encodeURIComponent(mid);
        if (isStoppable) {
          html += '<a class="btn-action btn-watch" href="' + watchUrl + '" target="_blank">Watch</a>';
        } else {
          html += '<a class="btn-action btn-watch disabled" aria-disabled="true">Watch</a>';
        }
        var detailUrl = CTL + '/match_detail.html?match=' + encodeURIComponent(mid);
        html += '<a class="btn-action btn-detail" href="' + detailUrl + '" target="_blank">Detail</a>';
        html += '</span>';
        html += '</div>';

        if (m.error) {
          html += '<div class="error-msg">' + esc(m.error) + '</div>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
    }

    function matchAction(matchId, action) {
      fetch(CTL + '/api/matches/' + encodeURIComponent(matchId) + '/' + action, {
        method: 'POST',
        mode: 'cors'
      })
        .then(function() { poll(); })
        .catch(function(err) { console.error('matchAction failed:', err); });
    }

    var lastMatchData = null;

    function poll() {
      fetch(CTL + '/api/matches', { mode: 'cors' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var changed = !lastMatchData || JSON.stringify(Object.keys(data)) !== JSON.stringify(Object.keys(lastMatchData));
          if (!changed) {
            Object.keys(data).forEach(function(mid) {
              if (!lastMatchData[mid] ||
                  lastMatchData[mid].state !== data[mid].state ||
                  lastMatchData[mid].stt_utterance_count !== data[mid].stt_utterance_count ||
                  JSON.stringify(lastMatchData[mid].configured_languages || []) !==
                  JSON.stringify(data[mid].configured_languages || [])) {
                changed = true;
              }
            });
          }

          if (changed) {
            renderMatches(data);
          }
          lastMatchData = data;
        })
        .catch(function() {
          container.innerHTML = '<div class="server-error">Cannot reach server at ' + esc(CTL) + '</div>';
        });
    }

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
